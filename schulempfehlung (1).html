<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internatsauswahl &#8212; T&#246;chter &amp; S&#246;hne</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brd:#84332f;--brd-l:#f7efee;--brd-m:#ecdcd8;--brd-d:#5c2a27;
  --text:#1a1a1a;--text2:#555;--text3:#888;
  --bg:#fdfbfa;--white:#fff;
  --green:#1a6644;--green-bg:#eaf4f0;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:16px}

/* ===== TOOL ===== */
.tool{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.tool-header{text-align:center;margin-bottom:2rem;padding-bottom:1.5rem;border-bottom:1px solid var(--brd-m)}
.tool-logo{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:3px;color:var(--brd);margin-bottom:6px}
.tool-title{font-size:24px;font-weight:700;color:var(--text);margin-bottom:4px}
.card{background:var(--white);border:1px solid var(--brd-m);border-radius:16px;padding:1.75rem;margin-bottom:1rem}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--brd);margin-bottom:1.25rem;padding-bottom:.75rem;border-bottom:1px solid var(--brd-l)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:600;color:var(--text2)}
.req{color:var(--brd);margin-left:2px}
.field input,.field select,.field textarea{padding:10px 14px;font-size:14px;font-family:'DM Sans',sans-serif;border:1.5px solid #e0e0e0;border-radius:10px;background:#fafafa;color:var(--text);transition:.2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brd);background:var(--white);box-shadow:0 0 0 3px rgba(132,51,47,.07)}
.field textarea{resize:vertical;min-height:80px;line-height:1.55}
.mt{margin-top:14px}
.school-list{display:flex;flex-direction:column;gap:12px}
.sc-card{border:1.5px solid var(--brd-m);border-radius:14px;padding:1.25rem;background:#fdfaf9}
.sc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.sc-num{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.sc-badge{width:26px;height:26px;border-radius:50%;background:var(--brd);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.btn-rm{background:none;border:1.5px solid var(--brd-m);color:var(--brd);font-size:11px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.2s}
.btn-rm:hover{background:var(--brd-l);border-color:var(--brd)}
.btn-add{width:100%;padding:13px;background:var(--white);border:2px dashed #ddd;border-radius:12px;color:#999;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:.2s;margin-top:8px}
.btn-add:hover{border-color:var(--brd);color:var(--brd);background:var(--brd-l)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--brd-m);flex-wrap:wrap}
.btn-p{padding:12px 26px;font-size:14px;font-weight:700;font-family:inherit;border-radius:10px;cursor:pointer;background:var(--brd);color:#fff;border:none;transition:.2s}
.btn-p:hover{background:var(--brd-d)}
.btn-o{padding:12px 18px;font-size:14px;font-weight:600;font-family:inherit;border-radius:10px;cursor:pointer;background:#fff;color:var(--text);border:1.5px solid #ddd;transition:.2s}
.btn-o:hover{border-color:var(--brd);color:var(--brd)}
.share-box{display:none;margin-top:1.25rem;background:var(--brd-l);border:1.5px solid var(--brd-m);border-radius:14px;padding:1.25rem}
.share-title{font-size:13px;font-weight:600;color:var(--brd);margin-bottom:8px}
.share-row{display:flex;gap:8px}
.share-row input{flex:1;padding:10px 14px;font-size:12px;background:#fff;border:1.5px solid var(--brd-m);border-radius:10px;font-family:inherit}
.copy-btn{padding:10px 18px;background:var(--brd);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.copy-ok{font-size:12px;color:var(--green);margin-top:6px;display:none}
.email-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.email-row input{flex:1;min-width:180px;padding:10px 14px;font-size:13px;background:#fff;border:1.5px solid var(--brd-m);border-radius:10px;font-family:'DM Sans',sans-serif;color:var(--text)}
.btn-email{padding:10px 18px;background:var(--brd-d);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.2s}
.share-divider{height:1px;background:var(--brd-m);margin:12px 0}

/* Status */
.status-row{display:flex;align-items:center;gap:8px;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--brd-m)}
.status-label{font-size:12px;font-weight:600;color:var(--text2)}
.status-select{padding:6px 12px;font-size:12px;font-family:'DM Sans',sans-serif;border:1.5px solid #e0e0e0;border-radius:8px;background:#fafafa;cursor:pointer}

/* ===== ELTERN-ANSICHT ===== */
.view{display:none;max-width:800px;margin:0 auto}
.vh{background:linear-gradient(140deg,var(--brd) 0%,var(--brd-d) 100%);padding:2.5rem 2.5rem 2rem;color:#fff}
.vh-logo{font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:3px;opacity:.85;margin-bottom:1.5rem;font-weight:600}
.vh-name{font-family:'Cormorant Garamond',serif;font-size:48px;font-weight:600;line-height:1.1;margin-bottom:.5rem}
.vh-meta{display:flex;gap:1.5rem;margin-top:1.5rem;padding-top:1.25rem;border-top:1px solid rgba(255,255,255,.2);flex-wrap:wrap}
.vh-mi strong{display:block;font-size:17px;font-weight:600;margin-bottom:2px}
.vh-mi span{font-size:12px;opacity:.7}
.v-intro{background:var(--white);padding:2rem 2.5rem;border-bottom:1px solid var(--brd-m);font-size:15px;line-height:1.75;color:var(--text2)}
.v-section{padding:2rem 2.5rem;background:var(--bg)}
.v-sec-title{font-family:'Cormorant Garamond',serif;font-size:34px;color:var(--text);margin-bottom:.375rem}
.v-sec-sub{font-size:13px;color:var(--text3);margin-bottom:2rem}

/* Klappbare Länder */
.country-group{margin-bottom:1rem;background:var(--white);border-radius:14px;border:1px solid var(--brd-m);overflow:hidden}
.country-toggle{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;cursor:pointer;transition:.2s;user-select:none}
.country-toggle:hover{background:var(--brd-l)}
.country-toggle-left{display:flex;align-items:center;gap:12px}
.country-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--text)}
.country-count{font-size:13px;color:var(--text3)}
.country-arrow{font-size:14px;color:var(--text3);transition:transform .3s}
.country-arrow.open{transform:rotate(180deg)}
.country-content{display:none;padding:0 1.5rem 1.5rem}
.country-content.open{display:block}

/* Internat-Karte */
.sc-view{background:var(--white);border-radius:14px;border:1px solid var(--brd-m);margin-bottom:1.25rem;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.sc-view-img{width:100%;height:240px;object-fit:cover;display:block}
.sc-view-ph{width:100%;height:240px;background:linear-gradient(135deg,var(--brd-l),var(--brd-m));display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--brd)}
.sc-view-body{padding:1.5rem}
.sc-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:600;color:var(--text);margin-bottom:.75rem;line-height:1.2}
.sc-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem}
.pill{font-size:12px;padding:4px 12px;border-radius:99px;font-weight:500;white-space:nowrap}
.pill.yr{background:var(--brd-l);color:var(--brd)}
.pill.dur{background:#eef2ff;color:#3730a3}
.pill.ap{background:#f0fdf4;color:#166534}
.fb-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin-bottom:8px}
.fb-box{background:var(--green-bg);border-left:3px solid var(--green);border-radius:0 10px 10px 0;padding:1.125rem 1.5rem;font-size:15px;line-height:1.7;color:#1a3a2a;font-style:italic;margin-bottom:1.25rem}
.sc-note{font-size:13px;color:var(--text2);line-height:1.7;padding:.875rem 0;border-top:1px solid var(--brd-m);margin-bottom:1rem}
.btn-discover{display:inline-block;color:#fff;font-size:14px;font-weight:600;text-decoration:none;padding:10px 20px;border:1.5px solid var(--brd);border-radius:10px;transition:.2s;margin-bottom:1.25rem;background:var(--brd)}
.btn-discover:hover{background:var(--brd-d);border-color:var(--brd-d)}
.sc-addr{font-size:13px;color:var(--text3);margin-bottom:.75rem}
.sc-map{height:180px;border-radius:10px;overflow:hidden;border:1px solid var(--brd-m)}
.sc-map iframe{width:100%;height:100%;border:none;display:block}

/* Beraterin */
.v-contact{background:var(--white);padding:2.5rem;border-top:1px solid var(--brd-m)}
.advisor-box{display:grid;grid-template-columns:280px 1fr;gap:2.5rem;align-items:center}
.av-photo{width:100%;object-fit:cover;object-position:top center;border-radius:12px;display:block;background:var(--brd-l);aspect-ratio:3/4}
.av-photo-initials{aspect-ratio:3/4;background:linear-gradient(135deg,var(--brd),var(--brd-d));border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:64px;font-weight:600;color:#fff}
.av-text{display:flex;flex-direction:column;gap:.875rem;padding-top:.5rem;justify-content:center}
.av-greeting{font-family:'DM Sans',sans-serif;font-size:18px;font-style:normal;color:var(--text);line-height:1.4}
.av-name{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:600;color:var(--text);line-height:1.1}
.av-role{font-size:14px;color:var(--text);font-family:'DM Sans',sans-serif}
.av-contacts{display:flex;flex-direction:column;gap:6px;margin-top:.25rem}
.av-contact-link{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);text-decoration:none;font-weight:500;transition:.2s;font-family:'DM Sans',sans-serif}
.av-contact-link:hover{color:var(--brd)}
.av-contact-icon{width:16px;height:16px;flex-shrink:0}

.back-bar{background:var(--white);padding:12px 2.5rem;border-bottom:1px solid var(--brd-m);display:flex;align-items:center;gap:12px}
.back-bar button{background:none;border:1.5px solid #ddd;padding:7px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;color:#555}
.preview-tag{font-size:11px;color:#999}

@media(max-width:650px){
  .g2,.g3{grid-template-columns:1fr}
  .vh{padding:1.75rem 1.25rem 1.5rem}
  .vh-name{font-size:30px}
  .vh-meta{gap:1rem}
  .vh-mi{width:100%}
  .v-section,.v-intro,.v-contact{padding:1.5rem 1.25rem}
  .advisor-box{grid-template-columns:1fr;gap:1.5rem}
  .av-photo-wrap{max-width:280px;margin:0 auto;width:100%}
  .av-photo{aspect-ratio:3/4;width:100%;max-height:350px;object-fit:cover;object-position:top center}
  .av-photo-initials{aspect-ratio:1;max-height:200px}
  .av-text{align-items:flex-start;text-align:left}
  .av-name{font-size:28px}
  .back-bar{padding:10px 1.25rem}
  .share-row{flex-direction:column}
  .actions{justify-content:stretch}
  .actions .btn-p,.actions .btn-o{flex:1;text-align:center}
}
</style>
</head>
<body>

<!-- TOOL -->
<div id="tool-view" class="tool">
  <div class="tool-header">
    <div class="tool-logo">T&#214;CHTER und S&#214;HNE</div>
    <div class="tool-title">Internatsauswahl erstellen</div>
  </div>

  <!-- Wer f&#252;llt aus -->
  <div class="card">
    <div class="card-title">Ausgef&#252;llt von</div>
    <div class="g2">
      <div class="field">
        <label>Wer f&#252;llt diese Auswahl aus? <span class="req">*</span></label>
        <select id="f-role">
          <option value="">Bitte ausw&#228;hlen ...</option>
          <option value="beraterin">Beraterin</option>
          <option value="office">Office</option>
        </select>
      </div>
      <div class="field">
        <label>Sprache der Vorlage</label>
        <select id="f-lang">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Familie -->
  <div class="card">
    <div class="card-title">Familie &amp; Sch&#252;lerin / Sch&#252;ler</div>
    <div class="g2">
      <div class="field">
        <label>Vorname <span class="req">*</span></label>
        <input type="text" id="f-student" placeholder="z.B. Emma">
      </div>
      <div class="field">
        <label>Familienname <span class="req">*</span></label>
        <input type="text" id="f-family" placeholder="z.B. M&#252;ller">
      </div>
    </div>
    <div class="g3 mt">
      <div class="field">
        <label>Start <span class="req">*</span></label>
        <input type="text" id="f-year" placeholder="z.B. September 2026">
      </div>
      <div class="field">
        <label>Einstieg (optional)</label>
        <input type="text" id="f-einstieg" placeholder="z.B. Year 10 / Klasse 9">
      </div>
      <div class="field">
        <label>Aufenthaltsdauer</label>
        <input type="text" id="f-duration" placeholder="z.B. 1 Jahr / 2 Jahre">
      </div>
    </div>
    <div class="g2 mt">
      <div class="field">
        <label>Beraterin <span class="req">*</span></label>
        <select id="f-advisor">
          <option value="">Ausw&#228;hlen ...</option>
          <option value="Janka Z&#246;ller|jjz@internate.org|+49 611 1805882|Gesellschafterin">Janka Z&#246;ller</option>
          <option value="Johanna Lingenthal|jl@internate.org|+49 611 1805882|Operative Geschäftsführung">Johanna Lingenthal</option>
          <option value="Ann-Kathrin Schiefer|aks@internate.org|+49 611 1805882|Senior Consultant">Ann-Kathrin Schiefer</option>
          <option value="Mirjam Auweiler|ma@internate.org|+49 611 1805882|Senior Consultant">Mirjam Auweiler</option>
          <option value="Gesine Meyer|gm@internate.org|+49 611 1805882|Senior Consultant">Gesine Meyer</option>
        </select>
      </div>
    </div>
    <div class="field mt">
      <label>Pers&#246;nliche Nachricht (optional)</label>
      <textarea id="f-intro" placeholder="Pers&#246;nlicher Einstiegstext ..."></textarea>
    </div>
  </div>

  <!-- Internate -->
  <div class="card">
    <div class="card-title">Empfohlene Internate</div>
    <div class="school-list" id="sc-list"></div>
    <button class="btn-add" onclick="addSchool()">+ Internat hinzuf&#252;gen</button>
  </div>

  <div class="actions">
    <button class="btn-o" onclick="showPreview()">Vorschau</button>
    <button class="btn-o" onclick="saveDraft()">Entwurf speichern</button>
    <button class="btn-p" onclick="generateLink()">Link generieren &amp; speichern</button>
  </div>

  <!-- Status -->
  <div class="status-row" id="status-row" style="display:none">
    <span class="status-label">Status:</span>
    <select class="status-select" id="status-select" onchange="updateStatus(this.value)">
      <option value="Entwurf">Entwurf</option>
      <option value="Gesendet">Gesendet</option>
      <option value="Abgelegt">Abgelegt</option>
    </select>
    <span id="status-save-ok" style="font-size:12px;color:var(--green);display:none">Gespeichert</span>
  </div>

  <div class="share-box" id="share-box">
    <div class="share-title">Link f&#252;r die Familie:</div>
    <div class="share-row">
      <input type="text" id="share-url" readonly>
      <button class="copy-btn" onclick="copyLink()">Kopieren</button>
    </div>
    <div class="copy-ok" id="copy-ok">Link kopiert!</div>
    <div class="share-divider"></div>
    <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">Per E-Mail senden:</div>
    <div class="email-row">
      <input type="email" id="f-family-email" placeholder="E-Mail der Familie (An:)">
      <button class="btn-email" onclick="sendEmail()">E-Mail &#246;ffnen</button>
    </div>
    <div style="font-size:11px;color:var(--text3);margin-top:6px">Die Beraterin wird automatisch in CC gesetzt.</div>
  </div>
</div>

<div id="view" class="view"></div>

<script>
var AT_TOKEN = window.AT_TOKEN || '';
var AT_BASE  = 'app0B1xkoUbdYCvf0';
var AT_TABLE = 'tblvwE7HqdENGBa98';
var EDIT_RECORD_ID = new URLSearchParams(window.location.search).get('editId') || null;

var COUNTRY_NAMES={
  'GB':'Gro\u00dfbritannien','UK':'Gro\u00dfbritannien','England':'Gro\u00dfbritannien',
  'USA':'USA','US':'USA','United States':'USA',
  'CA':'Kanada','CAN':'Kanada','Canada':'Kanada',
  'CH':'Schweiz','Switzerland':'Schweiz',
  'DE':'Deutschland','Germany':'Deutschland',
  'AT':'\u00d6sterreich','Austria':'\u00d6sterreich',
  'FR':'Frankreich','France':'Frankreich',
  'ES':'Spanien','Spain':'Spanien',
  'IT':'Italien','Italy':'Italien',
  'NZ':'Neuseeland','New Zealand':'Neuseeland',
  'AU':'Australien','Australia':'Australien'
};
function normC(c){
  var n=COUNTRY_NAMES[(c||'').trim()]||(c||'').trim();
  return n;
}
function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function linkify(text){
  // URLs in Text automatisch als klickbare Links darstellen
  var escaped = esc(text);
  return escaped.replace(/(https?:\/\/[^\s<"]+)/g, '<a href="$1" target="_blank" style="color:var(--green);word-break:break-all;">$1</a>');
}

var cmsSchools=[];
var ADVISOR_DATA={};

function loadAdvisors(){
  Array.from(document.querySelectorAll('.ts-advisor')).forEach(function(el){
    var name=(el.getAttribute('data-name')||'').trim();
    if(!name)return;
    ADVISOR_DATA[name]={
      photo:(function(){
        var div=el.querySelector('.ts-advisor-img');
        if(div){
          var bg=div.style.backgroundImage||'';
          if(bg){var m=bg.match(/url\(["']?([^"'\)]+)["']?\)/);if(m&&m[1]&&m[1].indexOf('data:')<0)return m[1];}
          if(div.tagName==='IMG'&&div.src&&div.src.indexOf('data:')<0)return div.src;
        }
        return(el.getAttribute('data-photo')||'').trim();
      })(),
      email:(el.getAttribute('data-email')||'').trim(),
      phone:(el.getAttribute('data-phone')||'').trim(),
      role:(el.getAttribute('data-role')||'Beraterin').trim()
    };
  });
}

function loadCms(){
  loadAdvisors();
  cmsSchools=Array.from(document.querySelectorAll('.rp-cms-school')).map(function(el){
    var gps=(el.getAttribute('data-gps')||'').split(',');
    var apKm=(el.getAttribute('data-airport-km')||'').trim().replace(/ca\.?\s*/i,'').trim();
    var photo=(function(){
      var img=el.querySelector('.rp-school-img');
      if(img){
        var ds=img.getAttribute('data-src')||'';
        if(ds&&ds.indexOf('data:')<0&&ds.indexOf('http')===0)return ds.split(' ')[0];
        if(img.src&&img.src.indexOf('data:')<0&&img.src.indexOf('http')===0)return img.src;
        var ss=img.getAttribute('srcset')||'';
        if(ss)return ss.split(',')[0].trim().split(' ')[0];
      }
      return(el.getAttribute('data-photo')||'').trim();
    })();
    var profileUrl=(function(){
      var u=(el.getAttribute('data-profile-url')||'').trim();
      if(!u)return'';
      if(u.indexOf('http')===0)return u;
      if(u.indexOf('/')!==0)u='/internat/'+u;
      return'https://www.internate.org'+u;
    })();
    return{
      name:(el.getAttribute('data-name')||'').trim(),
      photo:photo,
      address:(el.getAttribute('data-address')||'').trim(),
      country:normC(el.getAttribute('data-country')||''),
      airport:(el.getAttribute('data-airport')||'').trim(),
      airportKm:apKm,
      profileUrl:profileUrl,
      lat:parseFloat((gps[0]||'').trim())||null,
      lng:parseFloat((gps[1]||'').trim())||null
    };
  }).filter(function(s){return s.name;});
  cmsSchools.sort(function(a,b){return a.name.localeCompare(b.name,'de');});
}

function cmsOpts(sel){
  var h='<option value="">Internat ausw\u00e4hlen ...</option>';
  var byC={};
  cmsSchools.forEach(function(s){var c=s.country||'Weitere';if(!byC[c])byC[c]=[];byC[c].push(s);});
  Object.keys(byC).sort().forEach(function(c){
    h+='<optgroup label="'+esc(c)+'">';

var schools=[],sc=0;
function addSchool(){sc++;schools.push({id:sc,name:'',feedback:'',note:'',duration:'',einstieg:''});renderSchools();}
function removeSchool(id){schools=schools.filter(function(s){return s.id!==id;});renderSchools();}
function moveSchool(id,dir){
  var idx=schools.findIndex(function(s){return s.id===id;});
  if(idx===-1)return;
  var newIdx=idx+dir;
  if(newIdx<0||newIdx>=schools.length)return;
  var tmp=schools[idx];schools[idx]=schools[newIdx];schools[newIdx]=tmp;
  renderSchools();
}
function upd(id,f,v){
  var s=schools.find(function(s){return s.id===id;});
  if(!s)return;s[f]=v;
  if(f==='name'){s.cms=cmsSchools.find(function(x){return x.name===v;})||null;renderSchools();}
}

function renderSchools(){
  var c=document.getElementById('sc-list');c.innerHTML='';
  schools.forEach(function(s,si){
    var cs=s.cms||cmsSchools.find(function(x){return x.name===s.name;})||{};
    var div=document.createElement('div');div.className='sc-card';
    div.innerHTML=''

      +'<div class="sc-num"><div class="sc-badge">'+(si+1)+'</div>Internat '+(si+1)
      +(cs.country?' <span style="font-size:12px;color:var(--text3);font-weight:400">('+esc(cs.country)+')</span>':'')
      +'</div>'
      +'<div style="display:flex;gap:6px;align-items:center">'
      +(si>0?'<button class="btn-rm" onclick="moveSchool('+s.id+',-1)" title="Nach oben">&#8593;</button>':'')
      +(si<schools.length-1?'<button class="btn-rm" onclick="moveSchool('+s.id+',1)" title="Nach unten">&#8595;</button>':'')
      +(schools.length>1?'<button class="btn-rm" onclick="removeSchool('+s.id+')">Entfernen</button>':'')

function validate(){
  var e=[];
  if(!document.getElementById('f-role').value)e.push('Bitte ausw\u00e4hlen wer ausf\u00fcllt');
  if(!document.getElementById('f-student').value.trim())e.push('Vorname fehlt');
  if(!document.getElementById('f-family').value.trim())e.push('Familienname fehlt');
  if(!document.getElementById('f-year').value.trim())e.push('Start fehlt');

  if(!document.getElementById('f-advisor').value)e.push('Beraterin ausw\u00e4hlen');
  if(!schools.length)e.push('Mindestens ein Internat hinzuf\u00fcgen');

function buildState(){
  var role=document.getElementById('f-role').value;
  var advisorVal=document.getElementById('f-advisor').value;
  var advisorName=advisorVal.split('|')[0]||advisorVal;
  var advisorInfo=ADVISOR_DATA[advisorName]||{};
  return{
    role:role,
    lang:(function(){var el=document.getElementById('f-lang');return el?el.value:'de';})(),
student:document.getElementById('f-student').value.trim(),
    family:document.getElementById('f-family').value.trim(),
    year:document.getElementById('f-year').value.trim(),
    duration:(function(){var el=document.getElementById('f-duration');return el?el.value.trim():'';})(),
    einstieg:(function(){var el=document.getElementById('f-einstieg');return el?el.value.trim():'';})(),
    advisor:advisorName,
    advisorEmail:advisorVal.split('|')[1]||'',
    advisorPhone:advisorVal.split('|')[2]||advisorInfo.phone||'',
    advisorRole:advisorVal.split('|')[3]||advisorInfo.role||'Senior Consultant',
    advisorPhoto:advisorInfo.photo||'',
    intro:document.getElementById('f-intro').value.trim(),
    schools:schools.map(function(s){
      var cs=s.cms||cmsSchools.find(function(x){return x.name===s.name;})||{};
      return{name:s.name,duration:s.duration||'',einstieg:s.einstieg||'',feedback:s.feedback,note:s.note,
        country:normC(cs.country||''),address:cs.address||'',
        airport:cs.airport||'',airportKm:cs.airportKm||'',
        photo:cs.photo||'',profileUrl:cs.profileUrl||'',
        lat:cs.lat||null,lng:cs.lng||null};
    })
  };
}

function saveToAirtable(status, cb){
  var state=buildState();
  var encoded=btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  var longUrl=window.location.href.split('?')[0]+'?empfehlung='+encoded;
  var fields={
    'Name':state.family+' \u00b7 '+state.student,
    'Familie':state.family,
    'Sch\u00fclerin':state.student,
    'Start':state.year,
    'Beraterin':state.advisor,
    'Schulen':state.schools.map(function(s){return s.name;}).join(', '),
    'Datum':new Date().toLocaleDateString('de-DE')+' '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}),
    'Link':longUrl,
    'Status':status
  };
  var method=EDIT_RECORD_ID?'PATCH':'POST';
  var path=EDIT_RECORD_ID?'/'+EDIT_RECORD_ID:'';
  fetch('https://api.airtable.com/v0/'+AT_BASE+'/'+AT_TABLE+path,{
    method:method,
    headers:{'Authorization':'Bearer '+AT_TOKEN,'Content-Type':'application/json'},
    body:JSON.stringify(EDIT_RECORD_ID?{fields:fields}:{records:[{fields:fields}]})
  }).then(function(r){return r.json();})
  .then(function(data){
    var id=EDIT_RECORD_ID||(data.records&&data.records[0]&&data.records[0].id);
    if(id&&!EDIT_RECORD_ID){
      EDIT_RECORD_ID=id;
      window.history.replaceState({},'',window.location.pathname+'?editId='+id);
    }
    if(cb)cb(id);
    // Status anzeigen
    document.getElementById('status-row').style.display='flex';
    document.getElementById('status-select').value=status;
  }).catch(function(){alert('Fehler beim Speichern.');});
}

function updateStatus(status){
  if(!EDIT_RECORD_ID){alert('Bitte zuerst speichern.');return;}
  fetch('https://api.airtable.com/v0/'+AT_BASE+'/'+AT_TABLE+'/'+EDIT_RECORD_ID,{
    method:'PATCH',
    headers:{'Authorization':'Bearer '+AT_TOKEN,'Content-Type':'application/json'},
    body:JSON.stringify({fields:{'Status':status}})
  }).then(function(){
    var ok=document.getElementById('status-save-ok');
    ok.style.display='inline';
    setTimeout(function(){ok.style.display='none';},2000);
  });
}

    +'<div class="av-contacts">'
    +(advisorEmail?'<a href="mailto:'+esc(advisorEmail)+'" class="av-contact-link">'+'<svg width="18px" height="18px" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><path d="M63.5,52.3958 L47,35.4028 L55.3,27.7028 L55.278,27.6808 L63.5,20.1028 L63.5,34.5968 L63.5,52.3958 Z M11.199,54.3018 L27.904,37.2008 L32.797,41.7038 C33.797,42.6028 35.097,43.1028 36.398,43.1028 C36.432,43.1028 36.466,43.0938 36.5,43.0928 C36.534,43.0938 36.567,43.1028 36.601,43.1028 C37.902,43.1028 39.203,42.6028 40.203,41.7038 L45.096,37.2008 L61.801,54.3018 L11.199,54.3018 Z M9.5,20.1028 L26,35.4028 L9.5,52.3958 L9.5,34.5968 L9.5,20.1028 Z M61.602,18.4998 L38.301,39.8008 C37.816,40.2858 37.166,40.5308 36.5,40.5448 C35.834,40.5308 35.184,40.2858 34.699,39.8008 L11.398,18.4998 L61.602,18.4998 Z M64.801,15.9998 L8.199,15.9998 C7.5,15.9998 7,16.6008 7,17.1988 L7,55.4998 C7,55.6538 7.035,55.8068 7.096,55.9508 C7.131,56.0338 7.187,56.0998 7.239,56.1718 C7.279,56.2288 7.31,56.2898 7.359,56.3398 C7.409,56.3888 7.47,56.4198 7.527,56.4598 C7.599,56.5108 7.664,56.5668 7.747,56.6028 C7.892,56.6638 8.045,56.6988 8.199,56.6988 L64.801,56.6988 C64.955,56.6988 65.108,56.6638 65.252,56.6028 C65.335,56.5668 65.401,56.5108 65.472,56.4598 C65.53,56.4198 65.59,56.3888 65.64,56.3398 C65.69,56.2898 65.721,56.2288 65.761,56.1718 C65.812,56.0998 65.868,56.0338 65.903,55.9508 C65.965,55.8068 66,55.6538 66,55.4998 L66,17.1988 C66,16.6008 65.5,15.9998 64.801,15.9998 Z" fill="#84332f"></path></svg>'+esc(advisorEmail)+'</a>':'')
    +(advisorPhone?'<a href="tel:'+esc(advisorPhone)+'" class="av-contact-link">'+'<svg width="18px" height="18px" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><path d="M59.9745157,45.1315142 L49.8633453,39.8760772 C47.4413819,38.6158234 44.4918518,39.2433226 42.9123104,41.4527083 L40.3860974,44.7131814 C37.964134,43.2427101 35.6474734,41.666079 33.0149046,39.0383605 C30.2759799,36.3044822 28.6964386,34.0993008 27.2232531,31.5745889 L30.3823357,29.0530302 C32.4883908,27.3702393 33.1223134,24.4303478 31.961877,22.1148023 L26.8041481,12.022261 C26.0680819,10.6547963 24.8055018,9.60370892 23.2259605,9.18537613 C21.6464192,8.76599226 20.0668779,9.07816521 18.696889,9.92008622 L12.271315,14.2316467 C10.1652599,15.7010669 8.90267985,18.119619 9.00587655,20.7473375 C9.11223233,22.533135 9.32178481,25.057847 9.84829859,26.946651 C11.8479979,34.5134292 16.5866218,42.2946293 23.1185517,48.9122756 C29.7536783,55.5351773 37.543976,60.1578597 45.1247213,62.158079 C46.9148681,62.6836227 49.547437,62.8927891 51.3365308,63 L51.7556358,63 C54.2818488,63 56.4942597,61.7397462 57.8642486,59.6375714 L62.0763587,53.1218806 C62.9198338,51.7544159 63.2367951,50.1777848 62.812425,48.7073135 C62.3975321,47.1264781 61.4508604,45.8662243 59.9745157,45.1315142 Z" fill="#84332f"></path></svg>'+esc(advisorPhone)+'</a>':'')

window.toggleCountry=function(id){
  var content=document.getElementById(id);
  var arrow=document.getElementById('arr-'+id);
  if(content){content.classList.toggle('open');arrow.classList.toggle('open');}
};

function showPreview(){
  var e=validate();
  if(e.length){alert('Bitte ausf\u00fcllen:\n\n\u2022 '+e.join('\n\u2022 '));return;}
  renderView(buildState(),false);
  document.getElementById('tool-view').style.display='none';
  document.getElementById('view').style.display='block';
  window.scrollTo(0,0);
}
function backToTool(){
  document.getElementById('tool-view').style.display='block';
  document.getElementById('view').style.display='none';
  window.scrollTo(0,0);
}

window.saveDraft=saveDraft;
window.saveToAirtable=saveToAirtable;
window.copyLink=copyLink;
window.sendEmail=sendEmail;
window.updateStatus=updateStatus;

document.addEventListener('DOMContentLoaded',function(){
  var shortId=new URLSearchParams(window.location.search).get('id');
  var encoded=new URLSearchParams(window.location.search).get('empfehlung');

  // Eltern-Ansicht: Tool sofort verstecken, BEVOR irgendwas gerendert wird
  if(shortId||encoded){
    document.getElementById('tool-view').style.display='none';
    document.getElementById('view').style.display='block';
  } else {
    loadCms();addSchool();
  }

  // Kurzer Link ?id=
  if(shortId){
    fetch('https://api.airtable.com/v0/'+AT_BASE+'/'+AT_TABLE+'/'+shortId,{
      headers:{'Authorization':'Bearer '+AT_TOKEN}
    }).then(function(r){return r.json();})
    .then(function(data){
      if(data.fields&&data.fields.Link){
        var match=data.fields.Link.match(/[?&]empfehlung=([^&]+)/);
        if(match){
          try{
            var state=JSON.parse(decodeURIComponent(escape(atob(match[1]))));
            renderView(state,true);
          }catch(e){}
        }
      }
    });
    return;
  }

  // Langer Link ?empfehlung=
  if(encoded){
    try{
      var state=JSON.parse(decodeURIComponent(escape(atob(encoded))));
      renderView(state,true);
    }catch(e){}
    return;
  }

  // Bearbeiten ?editId=
  if(EDIT_RECORD_ID){
    document.getElementById('status-row').style.display='flex';
    fetch('https://api.airtable.com/v0/'+AT_BASE+'/'+AT_TABLE+'/'+EDIT_RECORD_ID,{
      headers:{'Authorization':'Bearer '+AT_TOKEN}
    }).then(function(r){return r.json();})
    .then(function(data){
      if(!data.fields)return;
      var f=data.fields;
      if(f['Sch\u00fclerin'])document.getElementById('f-student').value=f['Sch\u00fclerin'];
      if(f.Familie)document.getElementById('f-family').value=f.Familie;
      if(f.Start)document.getElementById('f-year').value=f.Start;
      if(f.Status)document.getElementById('status-select').value=f.Status;
      var sel=document.getElementById('f-advisor');
      for(var i=0;i<sel.options.length;i++){
        if(sel.options[i].value.split('|')[0]===f.Beraterin){sel.selectedIndex=i;break;}
      }
      if(f.Link){
        var match=f.Link.match(/[?&]empfehlung=([^&]+)/);
        if(match){
          try{
            var state=JSON.parse(decodeURIComponent(escape(atob(match[1]))));
            if(state.intro)document.getElementById('f-intro').value=state.intro;

            if(state.duration){var dEl=document.getElementById('f-duration');if(dEl)dEl.value=state.duration;}
            if(state.lang){var lEl=document.getElementById('f-lang');if(lEl)lEl.value=state.lang;}
            if(state.einstieg){var eEl=document.getElementById('f-einstieg');if(eEl)eEl.value=state.einstieg;}
            if(state.role)document.getElementById('f-role').value=state.role;
            schools=[];
            state.schools.forEach(function(s){
              sc++;
              schools.push({id:sc,name:s.name,feedback:s.feedback||'',note:s.note||'',duration:s.duration||'',einstieg:s.einstieg||''});
            });
            renderSchools();
          }catch(e){}
        }
      }
      var banner=document.createElement('div');
      banner.style.cssText='background:var(--brd-l);border:1px solid var(--brd-m);border-radius:10px;padding:10px 14px;margin-bottom:1rem;font-size:12px;color:var(--brd);font-weight:600';
      banner.textContent='Internatsauswahl wird bearbeitet \u2014 Familie '+f.Familie;
      document.querySelector('.tool').insertBefore(banner,document.querySelector('.card'));
    });
  }
});
</script>
